plugins { id 'com.android.application' }
android {
    namespace 'com.devsurf.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.devsurf.mobile'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
